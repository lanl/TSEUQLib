# Runs the verification suite (tests/) on every push and pull request.
# Known bugs are strict xfails, so the run stays green until a fix makes
# one pass; then the XPASS fails the run until its KNOWN_BUGS entry is removed.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7
      # Solved fresh on every run (about 45 s with Python pinned), so CI
      # tests the newest releases. A cached environment saved at most ~40 s
      # and its test runs were twice as slow (2026-11-02), so we dropped it.
      - uses: conda-incubator/setup-miniconda@v4
        with:
          environment-file: ci/environment-ci.yml
          activate-environment: tseuqlib-ci
          conda-remove-defaults: true
      - name: Show versions
        run: conda list | grep -E "^(python|pyoti|numpy|scipy|sympy|pytest|pytest-xdist|line_profiler) "
      - name: Run tests
        run: python -B -m pytest -q -p no:cacheprovider -n auto tests -rxX
