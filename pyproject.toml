[project]
name = "tseuqlib"
version = "0.1.0"
description = "Taylor Series Expansion Uncertainty Quantification Library"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "BSD-3-Clause" }
authors = [{name = "Matthew Balcer", email = "mbalcer@lanl.gov"}, 
           {name = "Mauricio Aristizabal", email = "maristizabalca@stmarytx.edu"},
           {name = "Samuel Roberts", email = "samuel.roberts@utsa.edu"},
]
keywords = ["uq", "uncertainty", "taylor-series", "surrogate", "sensitivity"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.26.4",
    "pandas",
    "scipy",
    "sympy",
    "line_profiler",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = { find = { where = ["."], include = ["tseuqlib*"] } }

[tool.setuptools.package-data]
"tseuqlib" = ["*"]

